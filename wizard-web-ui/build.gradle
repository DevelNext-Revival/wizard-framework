plugins {
    id "com.moowork.node" version "1.2.0"
    id "com.moowork.gulp" version "1.2.0"
}

node {
    version = '6.11.3'
    npmVersion = '3.10.10'
    download = true

    nodeModulesDir = file("${project.projectDir}/src-js")
}

gulp {
    workDir = file("${project.projectDir}/src-js")
    colors = true
}

dependencies {
    compile project(":wizard-core")
}

task buildCss(dependsOn: 'gulp_compile-css') {
    doLast {
        copy {
            from "${gulp.workDir}/build/lib/dnext-engine.min.css"
            into "${project.projectDir}/resources/"
        }
    }
}

// собрать front.
task buildJs(dependsOn: ['gulp_compile']) {
    doLast {
        copy {
            from "${gulp.workDir}/build/lib/dnext-engine.js"
            into "${project.projectDir}/resources/"
        }

        copy {
            from "${gulp.workDir}/build/lib/dnext-engine.js.map"
            into "${project.projectDir}/resources/"
        }
    }
}

task buildWebLib(dependsOn: ['buildCss', 'buildJs']) {
}

// buildWebLib needs Node.js 6.11.3 downloaded from nodejs.org, which now 403s (EOL release).
// Not wiring it into processResources: resources/dnext-engine.{js,js.map,min.css} are
// already checked into git as prebuilt output, so plain resource processing picks them
// up as-is without needing the gulp/node toolchain at all. Run buildWebLib manually if
// the JS/CSS sources under src-js/ ever need to be rebuilt.